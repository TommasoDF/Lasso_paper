  abstract: ABSTRACT This paper tests the cross‐sectional implications of “keeping‐up‐with‐the‐Joneses”
    (KUJ) preferences in an international setting. When agents have KUJ preferences,
    in the presence of undiversifiable nonfinancial wealth, both world and domestic
