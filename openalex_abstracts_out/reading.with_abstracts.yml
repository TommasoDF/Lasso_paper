  source: openalex
  abstract: ABSTRACT We analyze cross‐sectional and time‐series information from 46
    equity markets around the world to consider whether short sales restrictions affect
    the efficiency of the market and the distributional characteristics of returns
    to individual stocks and market indices. We find some evidence that prices incorporate
    negative information faster in countries where short sales are allowed and practiced.
    A common conjecture by regulators is that short sales restrictions can reduce
    the relative severity of a market panic. We find strong evidence that in markets
    where short selling is either prohibited or not practiced, market returns display
    significantly less negative skewness.
  abstract_source: openalex
