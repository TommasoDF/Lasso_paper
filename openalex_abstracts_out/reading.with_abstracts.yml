  abstract: This paper develops a new estimation procedure for characteristic-based
    factor models&#13;\nof stock returns. We treat the factor model as a weighted
    additive nonparametric&#13;\nregression model, with the factor returns serving
    as time-varying weights and a set&#13;\nof univariate nonparametric functions
    relating security characteristic to the associated&#13;\nfactor betas. We use
    a time-series and cross-sectional pooled weighted additive nonparametric&#13;\nregression
    methodology to simultaneously estimate the factor returns and&#13;\ncharacteristic-beta
    functions. By avoiding the curse of dimensionality, our methodology&#13;\nallows
    for a larger number of factors than existing semiparametric methods. We&#13;\napply
    the technique to the three-factor Fama–French model, Carhart’s four-factor extension&#13;\nof
    it that adds a momentum factor, and a five-factor extension that adds an&#13;\nown-volatility
    factor. We find that momentum and own-volatility factors are at least as&#13;\nimportant,
    if not more important, than size and value in explaining equity return comovements.&#13;\nWe
    test the multifactor beta pricing theory against a general alternative&#13;\nusing
    a new nonparametric test
