  abstract: Aggregate consumption growth risk explains why low interest rate currencies
    do not appreciate as much as the interest rate differential and why high interest
    rate currencies do not depreciate as much as the interest rate differential. Domestic
    investors earn negative excess returns on low interest rate currency portfolios
