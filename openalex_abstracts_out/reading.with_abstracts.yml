- title: Testing for Smooth Structural Changes in Time Series Models via Nonparametric
    Regression
  authors: Bin Chen , Yongmiao Hong
  date: 2012-01
  venue: Econometrica
  url: https://doi.org/10.3982/ecta7990
  read: false
  id: doi:10.3982/ecta7990
  source: openalex
  abstract: Checking parameter stability of econometric models is a long-standing
    problem. Almost all existing structural change tests in econometrics are designed
    to detect abrupt breaks. Little attention has been paid to smooth structural changes,
    which may be more realistic in economics. We propose a consistent test for smooth
    structural changes as well as abrupt structural breaks with known or unknown change
    points. The idea is to estimate smooth time-varying parameters by local smoothing
    and compare the fitted values of the restricted constant parameter model and the
    unrestricted time-varying parameter model. The test is asymptotically pivotal
    and does not require prior information about the alternative. A simulation study
    highlights the merits of the proposed test relative to a variety of popular tests
    for structural changes. In an application, we strongly reject the stability of
    univariate and multivariate stock return prediction models in the postwar and
    post-oil-shocks periods.
