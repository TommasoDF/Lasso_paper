  abstract: ABSTRACT Barras, Scaillet, and Wermers propose the false discovery rate
    (FDR) to separate skill (alpha) from luck in fund performance. Using simulations
    with parameters informed by the data, we find that this methodology is conservative
    and underestimates the proportion of nonzero‐alpha funds. For example, 65% of
    funds with economically large alphas of are misclassified as zero alpha. This
