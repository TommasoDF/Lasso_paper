  abstract: ABSTRACT We propose a novel way to estimate a portfolio's abnormal price,
    the percentage gap between price and the present value of dividends computed with
    a chosen asset pricing model. Our method, based on a novel identity, resembles
    the time‐series estimator of abnormal returns, avoids the issues in alternative
