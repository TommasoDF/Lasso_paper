  source: openalex
  abstract: ABSTRACT This paper documents a strong relationship between short‐run
    reversals and stock illiquidity, even after controlling for trading volume. The
    largest reversals and the potential contrarian trading strategy profits occur
    in high turnover, low liquidity stocks, as the price pressures caused by non‐informational
    demands for immediacy are accommodated. However, the contrarian trading strategy
    profits are smaller than the likely transactions costs. This lack of profitability
    and the fact that the overall findings are consistent with rational equilibrium
    paradigms suggest that the violation of the efficient market hypothesis due to
    short‐term reversals is not so egregious after all.
  abstract_source: openalex
- title: Financially Constrained Stock Returns
  authors: Dmitry Livdan , Horacio Sapriza , Lu Zhang
  date: 2006-10
  venue: The Journal of Finance
