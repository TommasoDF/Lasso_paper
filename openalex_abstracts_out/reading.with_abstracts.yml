  abstract: ABSTRACT To rationalize the well‐known underperformance of the average
    actively managed mutual fund, we exploit the fact that retail funds in different
    market segments compete for different types of investors. Within the segment of
    funds marketed directly to retail investors, we show that flows chase risk‐adjusted
    returns, and that funds respond by investing more in active management. Importantly,
