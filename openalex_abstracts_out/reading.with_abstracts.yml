  abstract: ABSTRACT We develop a new and comprehensive database of firm‐level contributions
    to U.S. political campaigns from 1979 to 2004. We construct variables that measure
    the extent of firm support for candidates. We find that these measures are positively
    and significantly correlated with the cross‐section of future returns. The effect
    is strongest for firms that support a greater number of candidates that hold office
    in the same state that the firm is based. In addition, there are stronger effects
