  abstract: We document that net equity issuance is considerably more sensitive to
    aggregate stock returns and Q's than to firm-level stock returns and Q's. Very
    similar patterns also emerge when we look at merger activity. In light of earlier
    work (Campbell 1991, Vuolteenaho 2002) which finds that aggregate stock returns
    are less informative about future cashflows than are firm-level stock returns--and
