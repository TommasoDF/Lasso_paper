  abstract: ABSTRACT We find that several recently proposed consumption‐based models
    of stock returns, when evaluated using an optimal set of managed portfolios and
    the associated model‐implied conditional moment restrictions, fail to capture
    key features of risk premiums in equity markets. To arrive at these conclusions,
    we construct an optimal Generalized Method of Moments (GMM) estimator for models
    in which the stochastic discount factor (SDF) is a conditionally affine function
