  read: false
  id: doi:10.1257/aer.20110433
  source: openalex
  abstract: We show that the stock market may fail to aggregate information even if
    it appears to be efficient, and that the resulting decrease in the information
    content of prices may drastically reduce welfare. We solve a macroeconomic model
    in which information about fundamentals is dispersed and households make small,
    correlated errors when forming expectations about future productivity. As information
    aggregates in the market, these errors amplify and crowd out the information content
    of stock prices. When prices reflect less information, the conditional variance
    of stock returns rises, causing an increase in uncertainty and costly distortions
    in consumption, capital accumulation, and labor supply. (JEL D14, D83, D84, E21,
    E22, E24, G14)
  abstract_source: openalex
- title: 'Worker Betas: Five Facts about Systematic Earnings Risk'
  authors: Fatih Guvenen , Sam Schulhofer‐Wohl , Jae Song , Motohiro Yogo
  date: 2017-05
  venue: American Economic Review
  url: https://doi.org/10.1257/aer.p20171094
  read: false
  id: doi:10.1257/aer.p20171094
  source: openalex
  abstract: The magnitude of and heterogeneity in systematic earnings risk has important
    implications for various theories in macro, labor, and financial economics. Using
    administrative data, we document how the aggregate risk exposure of individual
    earnings to GDP and stock returns varies across gender, age, the worker's earnings
    level, and industry. Aggregate risk exposure is U-shaped with respect to the earnings
    level. In the middle of the earnings distribution, aggregate risk exposure is
    higher for males, younger workers, and construction and durable manufacturing.
    At the top of the earnings distribution, aggregate risk exposure is higher for
    older workers and finance.
