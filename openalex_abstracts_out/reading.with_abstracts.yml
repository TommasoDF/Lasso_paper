  read: false
  id: doi:10.1111/j.1540-6261.2006.00885.x
  source: openalex
  abstract: ABSTRACT We study how investor sentiment affects the cross‐section of
    stock returns. We predict that a wave of investor sentiment has larger effects
    on securities whose valuations are highly subjective and difficult to arbitrage.
    Consistent with this prediction, we find that when beginning‐of‐period proxies
    for sentiment are low, subsequent returns are relatively high for small stocks,
    young stocks, high volatility stocks, unprofitable stocks, non‐dividend‐paying
    stocks, extreme growth stocks, and distressed stocks. When sentiment is high,
    on the other hand, these categories of stock earn relatively low subsequent returns.
  abstract_source: openalex
- title: Industry Concentration and Average Stock Returns
  authors: Kewei Hou , David T. Robinson
  date: 2006-08
  venue: The Journal of Finance
  url: https://doi.org/10.1111/j.1540-6261.2006.00893.x
  read: false
  id: doi:10.1111/j.1540-6261.2006.00893.x
  source: openalex
  abstract: ABSTRACT Firms in more concentrated industries earn lower returns, even
    after controlling for size, book‐to‐market, momentum, and other return determinants.
    Explanations based on chance, measurement error, capital structure, and persistent
    in‐sample cash flow shocks do not explain this finding. Drawing on work in industrial
    organization, we posit that either barriers to entry in highly concentrated industries
    insulate firms from undiversifiable distress risk, or firms in highly concentrated
    industries are less risky because they engage in less innovation, and thereby
    command lower expected returns. Additional time‐series tests support these risk‐based
    interpretations.
  abstract_source: openalex
