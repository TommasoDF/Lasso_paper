  abstract: ABSTRACT This paper provides evidence of informed trading by individual
    investors around earnings announcements using a unique data set of NYSE stocks.
    We show that intense aggregate individual investor buying (selling) predicts large
    positive (negative) abnormal returns on and after earnings announcement dates.
