  abstract: ABSTRACT The effective cost of trading is usually estimated from transaction‐level
    data. This study proposes a Gibbs estimate that is based on daily closing prices.
    In a validation sample, the daily Gibbs estimate achieves a correlation of 0.965
    with the transaction‐level estimate. When the Gibbs estimates are incorporated
    into asset pricing specifications over a long historical sample (1926 to 2006),
