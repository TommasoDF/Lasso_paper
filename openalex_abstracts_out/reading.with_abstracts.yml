  id: doi:10.1111/jofi.13220
  source: openalex
  abstract: ABSTRACT We build a cross‐sectional factor model for investors' direct
    stockholdings and estimate it using data from almost 10 million retail accounts
    in the Indian stock market. Our model identifies strong investor clienteles for
    stock characteristics, most notably firm age and share price, and for particular
    clusters of stock characteristics. These clienteles are intuitively associated
    with investor attributes such as account age, size, and diversification. Coheld
    stocks tend to have higher return covariance, inconsistent with simple models
    of diversification but suggestive that clientele demands influence stock returns.
