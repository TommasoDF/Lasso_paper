  source: openalex
  abstract: ABSTRACT U.S. stocks are more volatile than stocks of similar foreign
    firms. A firm's stock return volatility can be higher for reasons that contribute
    positively (good volatility) or negatively (bad volatility) to shareholder wealth
    and economic growth. We find that the volatility of U.S. firms is higher mostly
    because of good volatility. Specifically, stock volatility is higher in the United
