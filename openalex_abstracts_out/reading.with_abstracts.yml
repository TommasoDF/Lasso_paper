  abstract: ABSTRACT Domestically listed Chinese (A‐share) firms have lower stock
    returns than externally listed Chinese, developed, and emerging country firms
    during 2000 to 2018. They also have lower net cash flows than matched unlisted
    Chinese firms. The underperformance of both stock and accounting returns is more
    pronounced for large A‐share firms, while small firms show no underperformance
    along either dimension. Investor sentiment explains low stock returns in the cross‐country
    and within‐A‐share samples. Institutional deficiencies in listing and delisting
    processes and weak corporate governance in terms of shareholder value creation
    are consistent with the underperformance in stock returns and net cash flows.
