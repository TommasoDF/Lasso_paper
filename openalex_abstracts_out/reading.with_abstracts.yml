  abstract: ABSTRACT We study whether exposure to marketwide correlation shocks affects
    expected option returns, using data on S&amp;P100 index options, options on all
    components, and stock returns. We find evidence of priced correlation risk based
    on prices of index and individual variance risk. A trading strategy exploiting
