  abstract: ABSTRACT This paper studies the asset pricing implications of a firm's
    opportunities to replace routine‐task labor with automation. I develop a model
    in which firms optimally undertake such replacement when their productivity is
    low. Hence, firms with routine‐task labor maintain a replacement option that hedges
    their value against unfavorable macroeconomic shocks and lowers their expected
    returns. Using establishment‐level occupational data, I construct a measure of
