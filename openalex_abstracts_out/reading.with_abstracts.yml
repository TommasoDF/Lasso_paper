  abstract: ABSTRACT This paper investigates whether improvements in the firm's internal
    corporate governance create value for shareholders. We analyze the market reaction
    to governance proposals that pass or fail by a small margin of votes in annual
    meetings. This provides a clean causal estimate that deals with the endogeneity
