  abstract: ABSTRACT Exploiting the fact that insiders trade for a variety of reasons,
    we show that there is predictable, identifiable “routine” insider trading that
    is not informative about firms’ futures. A portfolio strategy that focuses solely
    on the remaining “opportunistic” traders yields value‐weighted abnormal returns
    of 82 basis points per month, while abnormal returns associated with routine traders
