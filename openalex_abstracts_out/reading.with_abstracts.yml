- title: General Equilibrium Returns to Human and Investment Capital under Moral Hazard
  authors: Christine A. Parlour , Johan Waldén
  date: 2011-01
  venue: The Review of Economic Studies
  url: https://doi.org/10.1093/restud/rdq010
  read: false
  id: doi:10.1093/restud/rdq010
  source: openalex
  abstract: We present a tractable general equilibrium model with multiple sectors
    in which firms offer workers incentive contracts and simultaneously raise capital
    in stock markets. Workers optimally invest in the stock market and at the same
    time hedge labour income risk. Firms rationally take agents' portfolio decisions
    into account. In equilibrium, the cost of capital of each sector is endogenous.
    The distortion induced by moral hazard generates counterintuitive effects on the
    real economy. For example, the value of labour market participation may be higher
    under moral hazard than under first best, further a positive productivity shock
    may decrease welfare in the moral hazard economy. In addition, our model generates
    predictions on the effects of moral hazard on asset markets. For example, in the
    presence of moral hazard, the capital asset pricing model fails because firms,
    by choosing optimal incentive contracts, transfer risk both through wages and
    through the stock market. This leads to several cross-sectional asset pricing
    “anomalies”, such as size and value effects. As we characterize optimal contracts,
    we can also present empirical predictions relating workers' compensation, firm
    productivity, firm size, and financial market abnormal returns.
  abstract_source: openalex
- title: 'Dynamic Trading and Asset Prices: Keynes vs. Hayek'
  authors: Giovanni Cespa , Xavier Vives
  date: 2011-11
  venue: The Review of Economic Studies
  url: https://doi.org/10.1093/restud/rdr040
  read: false
  id: doi:10.1093/restud/rdr040
  source: openalex
  abstract: We investigate the dynamics of prices, information, and expectations in
    a competitive, noisy, dynamic asset pricing equilibrium model with long-term investors.
    We argue that the fact that prices can score worse or better than consensus opinion
    in predicting the fundamentals is a product of endogenous short-term speculation.
    For a given positive level of residual pay-off uncertainty, if liquidity trades
    display low persistence, rational investors act like market makers and accommodate
    the order flow and prices are farther away from fundamentals compared to consensus.
    This defines a “Keynesian” region; the complementary region is “Hayekian” in that
    rational investors chase the trend and prices are systematically closer to fundamentals
    than average expectations. The standard case of no residual uncertainty and liquidity
    trading following a random walk is on the frontier of the two regions and identifies
    the set of deep parameters for which rational investors abide by Keynes' dictum
    of concentrating on an asset “long-term prospects and those only”. The analysis
    also explains momentum and reversal in stock returns and how accommodation and
    trend-chasing strategies differ from these phenomena.
  abstract_source: openalex
- title: Heterogeneous Beliefs and Tests of Present Value Models
  authors: Kenneth Kasa , Todd B. Walker , Charles H. Whiteman
  date: 2013-12
  venue: The Review of Economic Studies
  url: https://doi.org/10.1093/restud/rdt051
  read: false
  id: doi:10.1093/restud/rdt051
  source: openalex
  abstract: This article develops a dynamic asset pricing model with persistent heterogeneous
    beliefs. The model features competitive traders who receive idiosyncratic signals
    about an underlying fundamentals process. We adapt Futia's (1981) frequency domain
    methods to derive conditions on the fundamentals that guarantee non-invertibility
    of the mapping between observed market data and the underlying shocks to agents'
    information sets. When these conditions are satisfied, agents remain asymmetrically
    informed in equilibrium and must ‘forecast the forecasts of others’. An econometrician,
    who incorrectly imposes a homogeneous beliefs equilibrium, will find that the
    asset price displays violations of variance bounds, predictability of excess returns,
    and rejections of cross-equation restrictions.
  abstract_source: openalex
- title: Asset Prices and Portfolio Choice with Learning from Experience
  authors: Paul Ehling , Alessandro Graniero , Christian Heyerdahl-Larsen
  date: 2017-12
  venue: The Review of Economic Studies
  url: https://doi.org/10.1093/restud/rdx077
  read: false
  id: doi:10.1093/restud/rdx077
  source: openalex
  abstract: We study asset prices and portfolio choice with overlapping generations,
    where the young disregard history to learn from own experience. Disregarding history
    implies less precise estimates of output growth, which in equilibrium leads the
    young to increase their investment in risky assets after positive returns, that
    is, they act as trend chasers. In equilibrium, the risk premium decreases after
    a positive shock and, therefore, trend chasing young agents lose wealth relative
    to old agents who behave as contrarians. Consistent with findings from survey
    data, the average belief about the risk premium in the economy relates negatively
    to future excess returns and is smoother than the true risk premium.
  abstract_source: openalex
- title: Manipulated Electorates and Information Aggregation
  authors: Mehmet Ekmekçi , Stephan Lauermann
  date: 2019-05
  venue: The Review of Economic Studies
  url: https://doi.org/10.1093/restud/rdz019
  read: false
  id: doi:10.1093/restud/rdz019
  source: openalex
  abstract: We study the aggregation of dispersed information in elections in which
    turnout may depend on the state. State-dependent turnout may arise from the actions
    of a biased and informed “election organizer”. Voters are symmetric ex ante and
    prefer policy a in state $\alpha$ and policy $b$ in state $\beta$, but the organizer
    prefers policy $a$ regardless of the state. Each recruited voter observes a private
    signal about the unknown state but does not learn the turnout.First, we characterize
    how the outcomes of large elections depend on the turnout pattern across states.
    In contrast to existing results for large elections, there are equilibria in which
    information aggregation fails whenever there is an asymmetry in turnout; information
    aggregation is only guaranteed in all equilibria if turnout is state independent.
    Second, when the turnout is the result of costly voter recruitment by a biased
    organizer, the organizer can ensure that its favourite policy $a$ is implemented
    with high probability independent of the state as the voter recruitment cost vanishes.
    Moreover, information aggregation will fail in all equilibria. The critical observation
    is that a vote is more likely to be pivotal for the decision if turnout is smaller,
    leading to a systematic bias of the decision toward the low-turnout state.
  abstract_source: openalex
- title: Recovering Investor Expectations from Demand for Index Funds
  authors: Mark Egan , Alexander MacKay , Hanbin Yang
  date: 2021-12
  venue: The Review of Economic Studies
  url: https://doi.org/10.1093/restud/rdab086
  read: false
  id: doi:10.1093/restud/rdab086
  source: openalex
  abstract: 'Abstract We use a revealed-preference approach to estimate investor expectations
    of stock market returns. Using data on demand for index funds that follow the
    S&amp;P 500, we develop and estimate a model of investor choice to flexibly recover
    the time-varying distribution of expected future returns across investors. Our
    analysis is facilitated by the prevalence of leveraged funds that track the same
    underlying asset: by choosing between higher and lower leverage, investors trade
    off higher return against less risk. Our estimates indicate that investor expectations
    are heterogeneous, extrapolative, and persistent. Following a downturn, investors
    become more pessimistic on average, but there is also an increase in disagreement
    among participating investors due to the presence of contrarian investors.'
  abstract_source: openalex
- title: 'Multinomial Logit Processes and Preference Discovery: Inside and Outside
    the Black Box'
  authors: Simone Cerreia‐Vioglio , Fabio Maccheroni , Mássimo Marinacci , Aldo Rustichini
  date: 2022-08
  venue: The Review of Economic Studies
  url: https://doi.org/10.1093/restud/rdac046
  read: false
  id: doi:10.1093/restud/rdac046
  source: openalex
  abstract: Abstract We provide two characterizations, one axiomatic and the other
    neuro-computational, of the dependence of choice probabilities on deadlines, within
    the widely used softmax representation $$\begin{align*} p_{t}\left( a,A\right)
    =\dfrac{e^{\frac{u\left( a\right) }{\lambda\left( t\right) }+\alpha\left( a\right)
    }}{\sum_{b\in A}e^{\frac{u\left( b\right) }{\lambda\left( t\right) }+\alpha\left(
    b\right) }}, \end{align*}$$ where $p_{t}\left( a,A\right)$ is the probability
    that alternative $a$ is selected from the set $A$ of feasible alternatives if
    $t$ is the time available to decide, $\lambda$ is a time-dependent noise parameter
    measuring the unit cost of information, $u$ is a time-independent utility function,
    and $\alpha$ is an alternative-specific bias that determines the initial choice
    probabilities (reflecting prior information and memory anchoring). Our axiomatic
    analysis provides a behavioural foundation of softmax (also known as Multinomial
    Logit Model when $\alpha$ is constant). Our neuro-computational derivation provides
    a biologically inspired algorithm that may explain the emergence of softmax in
    choice behaviour. Jointly, the two approaches provide a thorough understanding
    of softmaximization in terms of internal causes (neuro-physiological mechanisms)
    and external effects (testable implications).
  abstract_source: openalex
- title: Infrequent Random Portfolio Decisions in an Open Economy Model
  authors: Philippe Bacchetta , Eric van Wincoop , Eric R. Young
  date: 2022-08
  venue: The Review of Economic Studies
  url: https://doi.org/10.1093/restud/rdac054
  read: false
  id: doi:10.1093/restud/rdac054
  source: openalex
  abstract: Abstract We introduce a portfolio friction in a two-country DSGE model
    where investors face a constant probability to make new portfolio decisions. The
    friction leads to a more gradual portfolio adjustment to shocks and a weaker portfolio
    response to changes in expected excess returns. We apply the model to monthly
    data for the US and the rest of the world for equity portfolios. We show that
    the model is consistent with a broad set of evidence related to portfolios, equity
    prices, and excess returns for an intermediate level of friction. The evidence
    includes portfolio inertia, limited sensitivity to expected excess returns, a
    significant impact of financial shocks, excess return predictability, and asset
    price momentum and reversal.
  abstract_source: openalex
- title: Using Disasters to Estimate the Impact of Uncertainty
  authors: Scott Baker , Nicholas Bloom , Stephen Terry
  date: 2023-03
  venue: The Review of Economic Studies
  url: https://doi.org/10.1093/restud/rdad036
  read: false
  id: doi:10.1093/restud/rdad036
  source: openalex
  abstract: Abstract Uncertainty rises in recessions and falls in booms. But what
    is the causal relationship? We construct cross-country panel data on stock market
    returns to proxy for first- and second-moment shocks and instrument these with
    natural disasters, terrorist attacks, and political shocks. Our IV regression
    results reveal a robust negative short-term impact of second moments (uncertainty)
    on growth. Employing multiple vector autoregression estimation approaches, relying
    on a range of identifying assumptions, also reveals a negative impact of uncertainty
    on growth. Finally, we show that these results are reproducible in a conventional
    micro–macro business cycle model with time-varying uncertainty.
  abstract_source: openalex
- title: Mandated Disclosure, Stock Returns, and the 1964 Securities Acts Amendments
  authors: Michael Greenstone , Paul Oyer , Annette Vissing‐Jørgensen
  date: 2006-05
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1162/qjec.2006.121.2.399
  read: false
  id: doi:10.1162/qjec.2006.121.2.399
  source: openalex
  abstract: The 1964 Securities Acts Amendments extended the mandatory disclosure
    requirements that had applied to listed firms since 1934 to large firms traded
    Over-the-Counter (OTC). We find several pieces of evidence indicating that investors
    valued these disclosure requirements, two of which are particularly striking.
    First, a firm-level event study reveals that the OTC firms most affected by the
    1964 Amendments had abnormal excess returns of about 3.5 percent in the weeks
    immediately surrounding the announcement thai they had begun to comply with the
    new requirements. Second, we estimate that the most affected OTC firms had abnormal
    excess returns ranging between 11.5 and 22.1 percent in the period between when
    the legislation was initially proposed and when it went into force. These returns
    are adjusted for the standard four factors and are relative to NYSE/AMEX firms,
    matched on size and book-to-market equity, that were unaffected by the legislation.
    While we cannot determine how much of shareholders' gains were a transfer from
    insiders of these same companies, our results suggest that mandatory disclosure
    causes managers to focus more narrowly on maximizing shareholder value.
  abstract_source: openalex
- title: Rare Disasters and Asset Markets in the Twentieth Century*
  authors: Robert J. Barro
  date: 2006-07
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1162/qjec.121.3.823
  read: false
  id: doi:10.1162/qjec.121.3.823
  source: openalex
  abstract: The potential for rare economic disasters explains a lot of asset-pricing
    puzzles. I calibrate disaster probabilities from the twentieth century global
    history, especially the sharp contractions associated with World War I, the Great
    Depression, and World War II. The puzzles that can be explained include the high
    equity premium, low risk-free rate, and volatile stock returns. Another mystery
    that may be resolved is why expected real interest rates were low in the United
    States during major wars, such as World War II. The model, an extension of work
    by Rietz, maintains the tractable framework of a representative agent, time-additive
    and isoelastic preferences, and complete markets. The results hold with i.i.d.
    shocks to productivity growth in a Lucas-tree type economy and also with the inclusion
    of capital formation.
  abstract_source: openalex
- title: Betting on Hitler—The Value of Political Connections in Nazi Germany*
  authors: Thomas S. Ferguson , Hans‐Joachim Voth
  date: 2008-02
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1162/qjec.2008.123.1.101
  read: false
  id: doi:10.1162/qjec.2008.123.1.101
  source: openalex
  abstract: Abstract This paper examines the value of connections between German industry
    and the Nazi movement in early 1933. Drawing on previously unused contemporary
    sources about management and supervisory board composition and stock returns,
    we find that one out of seven firms, and a large proportion of the biggest companies,
    had substantive links with the National Socialist German Workers' Party. Firms
    supporting the Nazi movement experienced unusually high returns, outperforming
    unconnected ones by 5% to 8% between January and March 1933. These results are
    not driven by sectoral composition and are robust to alternative estimators and
    definitions of affiliation.
  abstract_source: openalex
- title: The (Perceived) Returns to Education and the Demand for Schooling<sup>*</sup>
  authors: Robert T. Jensen
  date: 2010-04
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1162/qjec.2010.125.2.515
  read: false
  id: doi:10.1162/qjec.2010.125.2.515
  source: openalex
  abstract: Economists emphasize the link between market returns to education and
    investments in schooling. Though many studies estimate these returns with earnings
    data, it is the perceived returns that affect schooling decisions, and these perceptions
    may be inaccurate. Using survey data for eighth-grade boys in the Dominican Republic,
    we find that the perceived returns to secondary school are extremely low, despite
    high measured returns. Students at randomly selected schools given information
    on the higher measured returns completed on average 0.20-0.35 more years of school
    over the next four years than those who were not. (c) 2010 by the President and
    Fellows of Harvard College and the Massachusetts Institute of Technology..
  abstract_source: openalex
- title: Gaming Performance Fees By Portfolio Managers
  authors: Dean P. Foster , H. Peyton Young
  date: 2010-11
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1162/qjec.2010.125.4.1435
  read: false
  id: doi:10.1162/qjec.2010.125.4.1435
  source: openalex
  abstract: We show that it is very difficult to devise performance-based compensation
    contracts that reward portfolio managers who generate excess returns while screening
    out managers who cannot generate such returns. Theoretical bounds are derived
    on the amount of fee manipulation that is possible under various performance contracts.
    We show that recent proposals to reform compensation practices, such as postponing
    bonuses and instituting clawback provisions, will not eliminate opportunities
    to game the system unless accompanied by transparency in managers' positions and
    strategies. Indeed, there exists no compensation mechanism that separates skilled
    from unskilled managers solely on the basis of their returns histories. (c) 2010
    by the President and Fellows of Harvard College and the Massachusetts Institute
    of Technology..
  abstract_source: openalex
- title: 'Long-Run Impacts of Unions on Firms: New Evidence from Financial Markets,
    1961–1999 *'
  authors: David S. Lee , Alexandre Mas
  date: 2012-01
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1093/qje/qjr058
  read: false
  id: doi:10.1093/qje/qjr058
  source: openalex
  abstract: We estimate the effect of new private-sector unionization on publicly
    traded firms' equity value in the United States over the 1961--1999 period using
    a newly assembled sample of National Labor Relations Board (NLRB) representation
    elections matched to stock market data. Event-study estimates show an average
    union effect on the equity value of the firm equivalent to $40, 500 per unionized
    worker, an effect that takes 15 to 18 months after unionization to fully materialize,
    and one that could not be detected by a short-run event study. At the same time,
    point estimates from a regression discontinuity design--comparing the stock market
    impact of close union election wins to close losses--are considerably smaller
    and close to zero. We find a negative relationship between the cumulative abnormal
    returns and the vote share in support of the union, allowing us to reconcile these
    seemingly contradictory findings. Copyright 2012, Oxford University Press.
  abstract_source: openalex
- title: Managerial Miscalibration*
  authors: Itzhak Ben‐David , John R. Graham , Campbell R. Harvey
  date: 2013-08
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1093/qje/qjt023
  read: false
  id: doi:10.1093/qje/qjt023
  source: openalex
  abstract: 'Abstract Using a unique 10-year panel that includes more than 13,300
    expected stock market return probability distributions, we find that executives
    are severely miscalibrated, producing distributions that are too narrow: realized
    market returns are within the executives’ 80% confidence intervals only 36% of
    the time. We show that executives reduce the lower bound of the forecast confidence
    interval during times of high market uncertainty; however, ex post miscalibration
    is worst during periods of high uncertainty. We also find that executives who
    are miscalibrated about the stock market show similar miscalibration regarding
    their own firms’ prospects. Finally, firms with miscalibrated executives seem
    to follow more aggressive corporate policies: investing more and using more debt
    financing.'
  abstract_source: openalex
- title: Risk, Returns, and Multinational Production*
  authors: José L. Fillat , Stefania Garetto
  date: 2015-09
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1093/qje/qjv031
  read: false
  id: doi:10.1093/qje/qjv031
  source: openalex
  abstract: 'Abstract This article starts by unveiling a strong empirical regularity:
    multinational corporations exhibit higher stock market returns and earning yields
    than nonmultinational firms. Within nonmultinationals, exporters exhibit higher
    earning yields and returns than firms selling only in their domestic market. To
    explain this pattern, we develop a real option value model where firms are heterogeneous
    in productivity and have to decide whether and how to sell in a foreign market
    where demand is risky. Selling abroad is a source of risk exposure to firms: following
    a negative shock, they are reluctant to exit the foreign market because they would
    forgo the sunk cost they paid to enter. Multinational firms are the most exposed
    because of the higher costs they have to pay to invest. The calibrated model is
    able to match both aggregate U.S. export and foreign direct investment data, and
    the observed cross-sectional differences in earning yields and returns.'
  abstract_source: openalex
- title: Rare Disasters and Exchange Rates *
  authors: Emmanuel Farhi , Xavier Gabaix
  date: 2015-10
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1093/qje/qjv040
  read: false
  id: doi:10.1093/qje/qjv040
  source: openalex
  abstract: 'Abstract We propose a new model of exchange rates, based on the hypothesis
    that the possibility of rare but extreme disasters is an important determinant
    of risk premia in asset markets. The probability of world disasters as well as
    each country’s exposure to these events is time-varying. This creates joint fluctuations
    in exchange rates, interest rates, options, and stock markets. The model accounts
    for a series of major puzzles in exchange rates: excess volatility and exchange
    rate disconnect, forward premium puzzle and large excess returns of the carry
    trade, and comovements between stocks and exchange rates. It also makes empirically
    successful signature predictions regarding the link between exchange rates and
    telltale signs of disaster risk in currency options.'
  abstract_source: openalex
- title: The Growing Importance of Social Skills in the Labor Market*
  authors: David Deming
  date: 2017-06
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1093/qje/qjx022
  read: false
  id: doi:10.1093/qje/qjx022
  source: openalex
  abstract: Abstract The labor market increasingly rewards social skills. Between
    1980 and 2012, jobs requiring high levels of social interaction grew by nearly
    12 percentage points as a share of the U.S. labor force. Math-intensive but less
    social jobs—including many STEM occupations—shrank by 3.3 percentage points over
    the same period. Employment and wage growth were particularly strong for jobs
    requiring high levels of both math skill and social skills. To understand these
    patterns, I develop a model of team production where workers “trade tasks” to
    exploit their comparative advantage. In the model, social skills reduce coordination
    costs, allowing workers to specialize and work together more efficiently. The
    model generates predictions about sorting and the relative returns to skill across
    occupations, which I investigate using data from the NLSY79 and the NLSY97. Using
    a comparable set of skill measures and covariates across survey waves, I find
    that the labor market return to social skills was much greater in the 2000s than
    in the mid-1980s and 1990s.
  abstract_source: openalex
- title: Who Profits from Patents? Rent-Sharing at Innovative Firms*
  authors: Patrick Kline , Neviana Petkova , Heidi Williams , Owen Zidar
  date: 2019-03
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1093/qje/qjz011
  read: false
  id: doi:10.1093/qje/qjz011
  source: openalex
  abstract: Abstract This article analyzes how patent-induced shocks to labor productivity
    propagate into worker compensation using a new linkage of U.S. patent applications
    to U.S. business and worker tax records. We infer the causal effects of patent
    allowances by comparing firms whose patent applications were initially allowed
    to those whose patent applications were initially rejected. To identify patents
    that are ex ante valuable, we extrapolate the excess stock return estimates of
    Kogan et al. (2017) to the full set of accepted and rejected patent applications
    based on predetermined firm and patent application characteristics. An initial
    allowance of an ex ante valuable patent generates substantial increases in firm
    productivity and worker compensation. By contrast, initial allowances of lower
    ex ante value patents yield no detectable effects on firm outcomes. Patent allowances
    lead firms to increase employment, but entry wages and workforce composition are
    insensitive to patent decisions. On average, workers capture roughly 30 cents
    of every dollar of patent-induced surplus in higher earnings. This share is roughly
    twice as high among workers present since the year of application. These earnings
    effects are concentrated among men and workers in the top half of the earnings
    distribution and are paired with corresponding improvements in worker retention
    among these groups. We interpret these earnings responses as reflecting the capture
    of economic rents by senior workers, who are most costly for innovative firms
    to replace.
  abstract_source: openalex
- title: Competing Models
  authors: José Luis Montiel Olea , Pietro Ortoleva , Mallesh M. Pai , Andrea Prat
  date: 2022-03
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1093/qje/qjac015
  read: false
  id: doi:10.1093/qje/qjac015
  source: openalex
  abstract: 'Abstract Different agents need to make a prediction. They observe identical
    data, but have different models: they predict using different explanatory variables.
    We study which agent believes they have the best predictive ability—as measured
    by the smallest subjective posterior mean squared prediction error—and show how
    it depends on the sample size. With small samples, we present results suggesting
    it is an agent using a low-dimensional model. With large samples, it is generally
    an agent with a high-dimensional model, possibly including irrelevant variables,
    but never excluding relevant ones. We apply our results to characterize the winning
    model in an auction of productive assets, to argue that entrepreneurs and investors
    with simple models will be overrepresented in new sectors, and to understand the
    proliferation of “factors” that explain the cross-sectional variation of expected
    stock returns in the asset-pricing literature.'
  abstract_source: openalex
- title: 'Labor Market Returns and the Evolution of Cognitive Skills: Theory and Evidence'
  authors: Santiago Hermo , Miika Päällysaho , David Seim , Jesse M. Shapiro
  date: 2022-04
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1093/qje/qjac022
  read: false
  id: doi:10.1093/qje/qjac022
  source: openalex
  abstract: Abstract A large literature in cognitive science studies the puzzling
    “Flynn effect” of rising fluid intelligence (reasoning skill) in rich countries.
    We develop an economic model in which a cohort’s mix of skills is determined by
    different skills’ relative returns in the labor market and by the technology for
    producing skills. We estimate the model using administrative data from Sweden.
    Combining data from exams taken at military enlistment with earnings records from
    the tax register, we document an increase in the relative labor market return
    to logical reasoning skill as compared to vocabulary knowledge. The estimated
    model implies that changes in labor market returns explain 37% of the measured
    increase in reasoning skill, and can also explain the decline in knowledge. An
    original survey of parents, an analysis of trends in school curricula, and an
    analysis of occupational characteristics show evidence of increasing emphasis
    on reasoning as compared to knowledge.
  abstract_source: openalex
- title: Revealed Beliefs and the Marriage Market Return to Education
  authors: Alison Andrew , Abi Adams‐Prassl
  date: 2025-04
  venue: The Quarterly Journal of Economics
  url: https://doi.org/10.1093/qje/qjaf020
  read: false
  id: doi:10.1093/qje/qjaf020
  source: openalex
  abstract: Abstract We develop a new methodology to estimate subjective beliefs from
    hypothetical-choice data. Our identification approach is based on the novel insight
    that by varying the amount of information on future realizations of stochastic
    variables, discrete-choice experiments can identify not only preferences but also
    subjective beliefs. We formally prove this result in a general setting and apply
    it to design a strategic survey instrument to measure Rajasthani parents’ subjective
    beliefs over the joint distribution of girls’ age of marriage, education, and
    marriage match quality. Our approach allows us to quantify the importance of perceived
    marriage market returns to education and youth, and perform various counterfactual
    simulation exercises. We find that eliminating the perceived marriage market return
    to education causes a 60% drop in the number of girls still in school at age 16,
    and almost none continue their education by age 18. Responses to our strategic
    survey instrument allow us accurately to predict realized schooling trajectories
    in follow-up data we collect from the same sample five years after our experimental
    data collection.
  abstract_source: openalex
- title: Testing Hypotheses About the Number of Factors in Large Factor Models
  authors: Alexei Onatski
  date: 2009-01
  venue: Econometrica
  url: https://doi.org/10.3982/ecta6964
  read: false
  id: doi:10.3982/ecta6964
  source: openalex
  abstract: In this paper we study high-dimensional time series that have the generalized
    dynamic factor structure. We develop a test of the null of k 0 factors against
    the alternative that the number of factors is larger than k 0 but no larger than
    k 1 >k 0. Our test statistic equals max k 0 >k&les;k 1 (Gamma k - Gamma k+1 )(Gamma
    k+1 - Gamma k+2 ), where Gamma i is the ith largest eigenvalue of the smoothed
    periodogram estimate of the spectral density matrix of data at a prespecified
    frequency. We describe the asymptotic distribution of the statistic, as the dimensionality
    and the number of observations rise, as a function of the Tracy-Widom distribution
    and tabulate the critical values of the test. As an application, we test different
    hypotheses about the number of dynamic factors in macroeconomic time series and
    about the number of dynamic factors driving excess stock returns. Copyright 2009
    The Econometric Society.
  abstract_source: openalex
- title: Efficient Semiparametric Estimation of the Fama-French Model and Extensions
