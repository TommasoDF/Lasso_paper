  abstract: 'We derive the analogue of the classic Arrow-Pratt approximation of the
    certainty equivalent under model uncertainty as de…ned by the smooth model of
    decision making under ambiguity of Klibano¤, Marinacci and Mukerji (2005).We study
    its scope via a portfolio allocation exercise that delivers a tractable mean-variance
    model adjusted for model uncertainty.In a problem with a risk-free asset, a risky
