  source: openalex
  abstract: ABSTRACT The 2001 to 2002 corporate scandals led to the Sarbanes–Oxley
    Act and to various amendments to the U.S. stock exchanges' regulations. We find
    that the announcement of these rules has a significant effect on firm value. Firms
    that are less compliant with the provisions of the rules earn positive abnormal
    returns compared to firms that are more compliant. We also find variation in the
    response across firm size. Large firms that are less compliant earn positive abnormal
    returns but small firms that are less compliant earn negative abnormal returns,
    suggesting that some provisions are detrimental to small firms.
