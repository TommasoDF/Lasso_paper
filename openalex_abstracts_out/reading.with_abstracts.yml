  read: false
  id: doi:10.1111/j.1540-6261.2006.00848.x
  source: openalex
  abstract: ABSTRACT When utility is nonseparable in nondurable and durable consumption
    and the elasticity of substitution between the two consumption goods is sufficiently
    high, marginal utility rises when durable consumption falls. The model explains
    both the cross‐sectional variation in expected stock returns and the time variation
    in the equity premium. Small stocks and value stocks deliver relatively low returns
    during recessions, when durable consumption falls, which explains their high average
    returns relative to big stocks and growth stocks. Stock returns are unexpectedly
    low at business cycle troughs, when durable consumption falls sharply, which explains
    the countercyclical variation in the equity premium.
  abstract_source: openalex
- title: Does Weak Governance Cause Weak Stock Returns? An Examination of Firm Operating
    Performance and Investors' Expectations
  authors: John E. Core , Wayne R. Guay , Tjomme O. Rusticus
  date: 2006-03
  venue: The Journal of Finance
  url: https://doi.org/10.1111/j.1540-6261.2006.00851.x
  read: false
  id: doi:10.1111/j.1540-6261.2006.00851.x
  source: openalex
  abstract: ABSTRACT We investigate Gompers, Ishii, and Metrick's (2003) finding that
    firms with weak shareholder rights exhibit significant stock market underperformance.
    If the relation between poor governance and poor returns is causal, we expect
    that the market is negatively surprised by the poor operating performance of weak
    governance firms. We find that firms with weak shareholder rights exhibit significant
    operating underperformance. However, analysts' forecast errors and earnings announcement
    returns show no evidence that this underperformance surprises the market. Our
    results are robust to controls for takeover activity. Overall, our results do
    not support the hypothesis that weak governance causes poor stock returns.
  abstract_source: openalex
- title: Are Busy Boards Effective Monitors?
  authors: Eliezer M. Fich , Anil Shivdasani
  date: 2006-03
  venue: The Journal of Finance
  url: https://doi.org/10.1111/j.1540-6261.2006.00852.x
  read: false
  id: doi:10.1111/j.1540-6261.2006.00852.x
  source: openalex
  abstract: ABSTRACT Firms with busy boards, those in which a majority of outside
    directors hold three or more directorships, are associated with weak corporate
    governance. These firms exhibit lower market‐to‐book ratios, weaker profitability,
    and lower sensitivity of CEO turnover to firm performance. Independent but busy
    boards display CEO turnover‐performance sensitivities indistinguishable from those
    of inside‐dominated boards. Departures of busy outside directors generate positive
    abnormal returns (ARs). When directors become busy as a result of acquiring an
    additional directorship, other companies in which they hold board seats experience
    negative ARs. Busy outside directors are more likely to depart boards following
    poor performance.
  abstract_source: openalex
- title: Pension Plan Funding and Stock Market Efficiency
  authors: Francesco A. Franzoni , José María García Marín
  date: 2006-03
  venue: The Journal of Finance
  url: https://doi.org/10.1111/j.1540-6261.2006.00859.x
  read: false
  id: doi:10.1111/j.1540-6261.2006.00859.x
  source: openalex
  abstract: ABSTRACT The paper argues that the market significantly overvalues firms
    with severely underfunded pension plans. These companies earn lower stock returns
    than firms with healthier pension plans for at least 5 years after the first emergence
    of the underfunding. The low returns are not explained by risk, price momentum,
    earnings momentum, or accruals. Further, the evidence suggests that investors
    do not anticipate the impact of the pension liability on future earnings, and
    they are surprised when the negative implications of underfunding ultimately materialize.
    Finally, underfunded firms have poor operating performance, and they earn low
    returns, although they are value companies.
  abstract_source: openalex
- title: Corporate Financial Policy and the Value of Cash
  authors: Michael W. Faulkender , Rong Wang
  date: 2006-08
  venue: The Journal of Finance
