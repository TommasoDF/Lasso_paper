  source: openalex
  abstract: ABSTRACT This paper finds support for the hypothesis that overvalued firms
    create value for long‐term shareholders by using their equity as currency. Any
    approach centered on abnormal returns is complicated by the fact that the most
    overvalued firms have the greatest incentive to engage in stock acquisitions.
    We solve this endogeneity problem by creating a sample of mergers that fail for
    exogenous reasons. We find that unsuccessful stock bidders significantly underperform
    successful ones. Failure to consummate is costlier for richly priced firms, and
