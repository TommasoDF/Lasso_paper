  abstract: We present a new identity that relates expected exchange rate appreciation
    to a risk-neutral covariance term, and use it to motivate a currency forecasting
    variable based on the prices of quanto index contracts. We show via panel regressions
    that the quanto forecast variable is an economically and statistically significant
    predictor of currency appreciation and of excess returns on currency trades. Out
    of sample, the quanto variable outperforms predictions based on uncovered interest
    parity, on purchasing power parity, and on a random walk as a forecaster of differential
    (dollar-neutral) currency appreciation. (JEL C53, E43, F31, F37, G12, G15)
