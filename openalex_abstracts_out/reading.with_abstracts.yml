  abstract: This article examines the stock market's changing valuation of corporate
    patentable assets between 1910 and 1939. It shows that the value of knowledge
    capital increased significantly during the 1920s compared to the 1910s as investors
    responded to the quality of technological inventions. Innovation was an important
    driver of the late 1920s stock market runup, and the Great Crash did not reflect
    a significant revaluation of knowledge capital relative to physical capital. Although
    substantial quantities of influential patents were accumulated during the post-crash
    recovery, high technology firms did not earn significant excess returns over low
    technology firms for most of the 1930s. (JEL G14, N12, N22, O30)
