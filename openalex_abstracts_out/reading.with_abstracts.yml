    higher model uncertainty only depends on the ambiguous asset''s alpha, setting
    the performance of the risky asset as benchmark.In addition, the portfolios recommended
    by our model are not systematically conservative on the share held in the ambiguous
    asset: indeed, in general, it is not true that greater ambiguity reduces the optimal
    demand for the ambiguous asset.The analytical tractability of the enhanced Arrow-Pratt
    approximation renders our model especially well suited for calibration exercises
    aimed at exploring the consequences of ambiguity aversion on equilibrium asset
    prices."Crises feed uncertainty.'
