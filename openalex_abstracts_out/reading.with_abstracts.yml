  abstract: To give empirical content to the model, we directly measure confidence
    from the cross-section of forecasts from the Survey of Professional Forecasters.
    We show that there are frequent large moves in the confidence measure in the data.
    Moreover, in the data, these large moves are contemporaneously highly correlated
    with large moves in asset returns, highlighting the importance of confidence risk
