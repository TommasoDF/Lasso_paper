  abstract: ABSTRACT We investigate the empirical implications of using various measures
    of payout yield rather than dividend yield for asset pricing models. We find statistically
    and economically significant predictability in the time series when payout (dividends
    plus repurchases) and net payout (dividends plus repurchases minus issuances)
    yields are used instead of the dividend yield. Similarly, we find that payout
    (net payout) yields contains information about the cross section of expected stock
    returns exceeding that of dividend yields, and that the high minus low payout
