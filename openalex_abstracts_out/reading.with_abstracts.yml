  abstract: ABSTRACT We present a model of equity trading with informed and uninformed
    investors where informed investors trade on firm‐specific and marketwide private
    information. The model is used to identify the component of order flow due to
    marketwide private information. Estimated trades driven by marketwide private
    information display little or no correlation with the first principal component
