  url: https://doi.org/10.1111/jofi.13216
  read: false
  id: doi:10.1111/jofi.13216
  source: openalex
  abstract: ABSTRACT We propose a duration‐based explanation for the premia on major
    equity factors, including value, profitability, investment, low‐risk, and payout
    factors. These factors invest in firms that earn most of their cash flows in the
    near future and could therefore be driven by a premium on near‐future cash flows.
    We test this hypothesis using a novel data set of single‐stock dividend futures,
    which are claims on dividends of individual firms. Consistent with our hypothesis,
    the expected Capital Asset Pricing Model alpha on individual cash flows decreases
    in maturity within a firm, and the alpha is not related to the above characteristics
    when controlling for maturity.
