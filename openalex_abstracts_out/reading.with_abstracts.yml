  id: doi:10.1111/j.1540-6261.2006.01005.x
  source: openalex
  abstract: 'ABSTRACT We derive an intertemporal asset pricing model and explore its
    implications for trading volume and asset returns. We show that investors trade
    in only two portfolios: the market portfolio, and a hedging portfolio that is
    used to hedge the risk of changing market conditions. We empirically identify
    the hedging portfolio using weekly volume and returns data for U.S. stocks, and
    then test two of its properties implied by the theory: Its return should be an
    additional risk factor in explaining the cross section of asset returns, and should
    also be the best predictor of future market returns.'
  abstract_source: openalex
- title: Insider Trading, News Releases, and Ownership Concentration
  authors: Jana P. Fidrmuc , Marc Goergen , Luc Renneboog
  date: 2006-12
  venue: The Journal of Finance
