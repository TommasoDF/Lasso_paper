  abstract: ABSTRACT Using a novel data set covering all individual investors' stock
    market transactions in Norway over 10 years, we analyze whether individual investors
    have a preference for professionally close stocks, and whether they make excess
    returns on such investments. After excluding own‐company stock holdings, investors
    hold 11% of their portfolio in stocks within their two‐digit industry of employment.
    Given the poor hedging properties of such investments, one would expect abnormally
    high returns. In contrast, all estimates of abnormal returns are negative, in
