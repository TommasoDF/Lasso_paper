  abstract: ABSTRACT We document that since 1994, the equity premium is earned entirely
    in weeks 0, 2, 4, and 6 in Federal Open Market Committee (FOMC) cycle time, that
    is, even weeks starting from the last FOMC meeting. We causally tie this fact
