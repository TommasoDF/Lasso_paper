  source: openalex
  abstract: ABSTRACT I find that economically meaningless index labels cause stock
    returns to covary in excess of fundamentals. S&amp;P/Barra follow a simple mechanical
    procedure to define their Value and Growth indices. In doing so, they reclassify
    some stocks from Value to Growth even after their book‐to‐market ratios have risen,
    and vice versa. Such stocks begin to covary more with the index they join and
