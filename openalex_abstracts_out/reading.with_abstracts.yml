  abstract: ABSTRACT I construct an equilibrium model that captures salient properties
    of index option prices, equity returns, variance, and the risk‐free rate. A representative
    investor makes consumption and portfolio choice decisions that are robust to his
    uncertainty about the true economic model. He pays a large premium for index options
    because they hedge important model misspecification concerns, particularly concerning
