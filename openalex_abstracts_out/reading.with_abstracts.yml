  read: false
  id: doi:10.1111/j.1540-6261.2009.01481.x
  source: openalex
  abstract: ABSTRACT We study the effect of financial constraints on risk and expected
    returns by extending the investment‐based asset pricing framework to incorporate
    retained earnings, debt, costly equity, and collateral constraints on debt capacity.
    Quantitative results show that more financially constrained firms are riskier
    and earn higher expected stock returns than less financially constrained firms.
    Intuitively, by preventing firms from financing all desired investments, collateral
    constraints restrict the flexibility of firms in smoothing dividend streams in
    the face of aggregate shocks. The inflexibility mechanism also gives rise to a
    convex relation between market leverage and expected stock returns.
