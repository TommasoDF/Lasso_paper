  abstract: ABSTRACT We quantify the role of global production linkages in explaining
    spillovers of U.S. monetary policy shocks on country‐sector stock returns. We
    estimate a structural spatial autoregression (SAR) model that is consistent with
    an open‐economy production network framework. Using the SAR model, we decompose
    the total impact of U.S. monetary policy on global stock returns into direct and
    network effects. Nearly 70% of the total impact is due to the network effect of
    global production linkages. Empirical counterfactuals show that shutting down
    global production linkages halves the total impact of U.S. monetary policy shocks.
