  venue: The Journal of Finance
  url: https://doi.org/10.1111/jofi.13198
  read: false
  id: doi:10.1111/jofi.13198
  source: openalex
  abstract: ABSTRACT Deviations from the law of one price between futures and spot
    prices—the futures‐cash basis—capture information about liquidity demand for equity
    market exposure in global markets. We show that the basis comoves with dealer
    and investor futures positions, is contemporaneously positively correlated with
    futures and spot market returns, and negatively predicts futures and spot returns.
    These findings are consistent with the futures‐cash basis reflecting liquidity
    demand that is common to futures and cash equity markets. We find persistent supply‐demand
    imbalances for equity index exposure reflected in the basis, giving rise to an
    annual premium of 5% to 6%.
