  abstract: ABSTRACT This paper investigates the stock market reaction to sudden changes
    in investor mood. Motivated by psychological evidence of a strong link between
    soccer outcomes and mood, we use international soccer results as our primary mood
    variable. We find a significant market decline after soccer losses. For example,
    a loss in the World Cup elimination stage leads to a next‐day abnormal stock return
    of −49 basis points. This loss effect is stronger in small stocks and in more
    important games, and is robust to methodological changes. We also document a loss
    effect after international cricket, rugby, and basketball games.
  abstract_source: openalex
- title: Corporate Governance and Acquirer Returns
  authors: Ronald W. Masulis , Cong Wang , Fei Xie
  date: 2007-08
  venue: The Journal of Finance
