  abstract: ABSTRACT This paper develops an empirical methodology for extracting pricing
    factors from investor portfolio data. We apply this approach to the stockholdings
    of Norwegian individual investors from 1997 to 2017. A two‐factor model, featuring
    the market portfolio and a long‐short portfolio constructed from the holdings
