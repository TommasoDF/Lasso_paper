  abstract: ABSTRACT A war‐related factor model derived from textual analysis of media
    news reports explains the cross section of expected stock returns. Using a semisupervised
    topic model to extract discourse topics from 7,000,000 New York Times stories
    spanning 160 years, the war factor predicts the cross section of returns across
    test assets derived from both traditional and machine learning construction techniques,
