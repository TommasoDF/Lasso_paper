  id: doi:10.1111/jofi.13484
  source: openalex
  abstract: ABSTRACT Farmer, Schmidt, and Timmermann (FST) document time‐variation
    in market return predictability, identifying “pockets” of significant predictability
    through kernel regressions. However, our analysis reveals a critical discrepancy
    between the method outlined by FST and the code actually implemented. Instead
    of using a one‐sided kernel, which guarantees out‐of‐sample forecasts, they perform
    in‐sample estimation with a two‐sided kernel. As a result, future information
    leaks into the forecasting model, undermining its reliability. Rectifying this
    error qualitatively alters the findings, invalidating most conclusions of the
    FST study. Thus, attempts to exploit such “pockets”—should they exist—offer little
    help in forecasting market returns.
