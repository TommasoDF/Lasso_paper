  abstract: ABSTRACT Investments in international fixed‐income securities are exposed
    to significant currency risks. We collect novel data on currency derivatives used
    by U.S. international fixed‐income funds. We document that while 90% of funds
    use currency forwards, they hedge, on average, only 18% of their currency exposure.
    Funds' currency forward positions differ substantially based on risk management
    demands related to portfolio currency exposure, return‐enhancement motives such
    as currency momentum and carry trade, and strategic considerations related to
    past performance and fund clientele. Funds that hedge their currency risk exhibit
    lower return variability, but do not generate inferior abnormal returns.
