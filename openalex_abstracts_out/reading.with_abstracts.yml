- title: 'Pockets of Predictability: A Replication'
  authors: Nusret Cakici , Christian Fieberg , Tobias Neumaier , Thorsten Poddig ,
    Adam Zaremba
  date: 2025-08
  venue: The Journal of Finance
  url: https://doi.org/10.1111/jofi.13484
