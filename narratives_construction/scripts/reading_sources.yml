# Topic filter: keep paper if ANY pattern matches title+abstract+keywords (if available)
filter:
  include_patterns:
  - "\\bstock returns?\\b|\\bmarket returns?\\b"
  - "\\bexcess returns?\\b|\\babnormal returns?\\b|\\balpha\\b"
  - "\\basset pricing\\b|\\basset prices?\\b|\\basset return(s)?\\b"
  - "\\bcross-sectional\\b|\\bcross section\\b"
  - "\\bfactor(s)?\\b|\\bfama[- ]french\\b|\\bcarhart\\b|\\bq[- ]theory\\b"
  - "\\bportfolio(s)?\\b|\\bportfolios?\\b"

  exclude_patterns:

    # --- Non-stock finance ---
    - "\\bprivate equity\\b|\\bventure capital\\b|\\bhedge funds?\\b"
    - "\\bbank(s|ing)?\\b|\\bcredit\\b|\\bloans?\\b"
    - "\\bbonds?\\b|\\bsovereign debt\\b|\\bcorporate bonds?\\b"
    - "\\binsurance\\b|\\bpension funds?\\b"

    # --- Admin / meta ---
    - "\\bcomment\\b"
    - "\\bcorrection\\b"
    - "\\berratum\\b"
    - "\\bfront matter\\b"
    - "\\beditorial\\b"


  # optional: tags to attach when matched
  # tag_rules:
  #   education: ["\\beducation\\b", "\\bhuman capital\\b"]
  #   expectations: ["\\bexpectation\\b", "\\bbelief\\b"]
  #   networks: ["\\bnetwork\\b", "\\bsocial\\b"]
  #   abm: ["\\bagent-based\\b|\\bagent based\\b|\\bABM\\b"]
  #   macro-finance: ["\\bmacro\\b", "\\bfinancial\\b", "\\basset pricing\\b"]

# Polling window
window_days: 15000

# Safety: cap per journal per run
max_new_per_journal: 100000
